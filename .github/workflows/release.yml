name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Check tag matches pom version
        run: |
          version="${GITHUB_REF_NAME#v}"
          jar="target/AutoReplant-${version}.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the pom version (expected ${jar}; built: $(ls target/*.jar))"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Extract release notes from CHANGELOG
        run: .github/scripts/release-notes.sh "$VERSION" > release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "target/AutoReplant-${VERSION}.jar" \
            --verify-tag \
            --title "AutoReplant ${VERSION}" \
            --notes-file release-notes.md
